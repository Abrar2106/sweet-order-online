<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Sweet Order</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<section class="card" id="loginBox"><h1>🔐 Admin Sweet Order</h1>
<form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="primary">Masuk</button></form><p id="loginMsg"></p></section>
<section id="dashboard" hidden><div class="top"><h1>📊 Dashboard</h1><button onclick="logout()">Keluar</button></div>
<div class="stats"><div class="stat">Pesanan <b id="count">0</b></div><div class="stat">Omzet <b id="sales">Rp0</b></div><div class="stat">Menunggu <b id="pending">0</b></div></div>
<div class="card"><h2>Pesanan</h2><div id="orders">Memuat...</div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script>
</body></html>
